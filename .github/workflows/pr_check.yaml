name: Check PR

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      skip-pytest:
        description: Skip source tests when the caller tests a published package
        type: boolean
        default: false
      skip-distribution:
        description: Skip distribution checks when the caller builds the release artifacts
        type: boolean
        default: false
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: ">=0.14,<1"
          args: check --output-format github
          src: guideloom tests
      - name: Format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: ">=0.14,<1"
          args: format --check --output-format github
          src: guideloom tests

  pyright:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          version: "0.13.1"
          enable-cache: true
      - name: Install
        run: |
          uv venv
          uv pip install -e . --group ci --group benchmark
      - name: Pyright
        run: uv run --no-sync basedpyright

  pytest:
    if: ${{ !inputs.skip-pytest }}
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        dependencies: [latest]
        include:
          - python-version: "3.13"
            dependencies: minimum
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.13.1"
          enable-cache: true
      - name: Install
        run: |
          uv venv
          uv pip install -e . --group ci
      - name: Install minimum runtime dependencies
        if: matrix.dependencies == 'minimum'
        run: uv pip install --upgrade --resolution lowest-direct -e ".[torch]"
      - name: Pytest
        run: uv run --no-sync pytest

  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/components/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          version: "0.13.1"
          enable-cache: true
      - name: Install documentation tools
        run: |
          uv venv
          uv pip install --group docs
          npm --prefix docs/components ci
      - name: Build documentation
        run: uv run --no-sync npm --prefix docs/components run build

  distribution:
    if: ${{ !inputs.skip-distribution }}
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          version: "0.13.1"
          enable-cache: true
      - name: Install release tools
        run: |
          uv venv
          uv pip install --group release
      - run: uv build
      - run: uv run --no-sync twine check --strict dist/*
