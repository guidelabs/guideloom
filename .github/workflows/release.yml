name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/pr_check.yaml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          version: "0.13.1"
          enable-cache: true
      - name: Install release tools
        run: |
          uv venv
          uv pip install --group release
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import runpy
          from packaging.version import Version
          version = runpy.run_path("guideloom/version.py")["__version__"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} must be v{version}")
          if Version(version).is_devrelease:
              raise SystemExit("Development versions cannot be published")
          PY
      - run: uv build
      - run: uv run --no-sync twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: dist/*
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/guideloom
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: distribution
          path: dist
      - id: release
        run: python3 scripts/check_testpypi.py status --dist dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.release.outputs.state == 'missing'
        with:
          repository-url: https://test.pypi.org/legacy/

  test-published:
    name: Test TestPyPI package
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: distribution
          path: dist
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          version: "0.13.1"
          enable-cache: true
      - name: Install and test the TestPyPI package
        run: uv run --no-project python scripts/check_testpypi.py test --dist dist

  pypi:
    if: github.event_name == 'release'
    needs: test-published
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/guideloom
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  docs-build:
    if: github.event_name == 'release'
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/components/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          version: "0.13.1"
          enable-cache: true
      - name: Install documentation tools
        run: |
          uv venv
          uv pip install --group docs
          npm --prefix docs/components ci
      - name: Build documentation
        run: uv run --no-sync npm --prefix docs/components run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  docs-publish:
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
