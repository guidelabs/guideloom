[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guideloom"]

[project]
name = "guideloom"
description = "Distributed high-performance dataset storage and a resumable dataloader"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.13.0,<3.15"
authors = [{name = "Guide Labs"}]
maintainers = [{name = "Guide Labs"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
keywords = ["pytorch", "datasets", "dataloader", "checkpoint", "streaming"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "numpy >= 2.3, < 3",
    "numba >= 0.62, < 1",
    "aiofiles >= 24.1, < 26",
]

[project.optional-dependencies]
torch = [
    "torch >= 2.9.1, < 3",
    "torchdata >= 0.11, < 1",
]

[project.urls]
Homepage = "https://github.com/guidelabs/guideloom"
Documentation = "https://guidelabs.github.io/guideloom/"
Repository = "https://github.com/guidelabs/guideloom"
Issues = "https://github.com/guidelabs/guideloom/issues"
Changelog = "https://github.com/guidelabs/guideloom/blob/main/CHANGELOG.md"

[dependency-groups]
benchmark = [
    "torch >= 2.9.1, < 3",  # matches the torch extra
    "torchdata >= 0.11, < 1",
    "tqdm ~= 4.67.1",
    "typed-settings[attrs] ~= 24.5.0",
]
docs = [
    "zensical ~= 0.0.71",
    "mkdocstrings-python ~= 2.0.9",
]
release = [
    "twine ~= 7.0.0",
]
test = [
    "pytest-asyncio ~= 1.4.0",  # enables pytest.mark.asyncio
    "pytest ~= 9.0.2",
    "torch >= 2.9.1, < 3",  # matches the torch extra
    "torchdata >= 0.11, < 1",
]
ci = [
    {include-group = "test"},
    "ruff >= 0.14, < 1",
    "pytest-github-actions-annotate-failures ~= 0.4.2",
    "basedpyright ~= 1.39.9",
]

[tool.hatch.version]
path = "guideloom/version.py"

[tool.pyright]
pythonVersion = "3.13"
include = ["guideloom", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]
reportPrivateImportUsage = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportMissingTypeStubs = "none"
reportUnusedCallResult = "none"
reportImplicitOverride = "none"
reportUnreachable = "none"
reportImplicitStringConcatenation = "none"
reportPrivateUsage = "none"
reportUnnecessaryIsInstance = "none"
reportAny = "none"
reportExplicitAny = "none"
reportUnnecessaryComparison = "none"
reportUnusedParameter = "none"
reportUnknownLambdaType = "none"
reportUnannotatedClassAttribute = "none"
reportPrivateLocalImportUsage = "error"
reportUntypedBaseClass = "error"
reportDeprecated = "error"
reportEmptyAbstractUsage = "error"
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportMissingParameterType = "error"
reportUnusedImport = "error"
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportUnusedVariable = "error"
reportDuplicateImport = "error"
reportWildcardImportFromLibrary = "error"
reportRedeclaration = "error"
reportUnnecessaryCast = "error"
reportUnusedCoroutine = "error"
reportUnusedExpression = "error"
reportInvalidAbstractMethod = "error"
reportSelfClsDefault = "error"
failOnWarnings = false

[tool.pytest]
minversion = "9.0"
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
]
testpaths = [ "tests" ]
strict = true

[tool.ruff]
line-length = 110
src = ["guideloom", "tests"]
[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    # isort
    "I",
    # pycodestyle (errors)
    "E",
    # pycodestyle (warnings)
    "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # commented-out-code
    "ERA",
    # flake8-bugbear
    "B",
    # pydocstyle
    "D",
    # pydoclint
    "DOC",
    # flake8-annotations
    "ANN",
    # flake8-async
    "ASYNC",
    # flake8-boolean-trap
    "FBT",
    # flake8-builtins
    "A",
    # flake8-comprehensions (C4)
    "C",
    # flake8-errmsg (EM)
    "EM",
    # flake8-quotes (Q)
    "Q",
    # tryceratops (TRY)
    "TRY",
    # flake8-pytest-style (PT)
    "PT",
    # flake8-simplify (SIM)
    "SIM",
    # flake8-return (RET)
    "RET",
    # NumPy-specific rules (NPY)
    "NPY",
    # flake8-pie (PIE)
    "PIE",
    # refurb (FURB)
    "FURB",
    # flake8-slots (SLOT)
    "SLOT",
    # Error (PLE)
    "PLE",
    # Ruff
    "RUF"
]
ignore = ['F722',
          'EM101', 'EM102',
          'PT012',
          'A005',
          'C9',
          'SIM117',
          'D100', 'D101', 'D102', 'D103', 'D104', 'D105', 'D107',
          'RUF022',
          'DOC501',
          'TRY003',
          'TRY301']
extend-select = [
    # preview pycodestyle (E/W) rules
    "E111", "E112", "E113", "E114", "E115", "E116", "E117",
    "E201", "E202", "E203", "E204", "E211",
    "E221", "E222", "E223", "E224", "E225", "E226", "E227", "E228", "E231",
    "E241", "E242", "E251", "E252",
    "E261", "E262", "E265", "E266",
    "E271", "E272", "E273", "E274", "E275",
    "E301", "E302", "E303", "E304", "E305", "E306",
    "E502",
    "W391",
    "RUF036", "RUF052", "RUF054",
    # pydoclint (DOC) preview rules
    "DOC102", "DOC201", "DOC202", "DOC402", "DOC403", "DOC502",
    # pylint refactor (PLR) rules
    "PLR0124", "PLR0133", "PLR0202", "PLR0203", "PLR0206", "PLR0402",
    "PLR1704", "PLR1708", "PLR1712", "PLR1714", "PLR1716", "PLR1722",
    "PLR1730", "PLR1733", "PLR1736", "PLR2044", "PLR5501", "PLR6201",
]
allowed-confusables = ["×"]
[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint.isort]
known-first-party = ["guideloom"]
length-sort-straight = true
from-first = true
force-sort-within-sections = true

[tool.deptry]
known_first_party = ["guideloom"]
pep621_dev_dependency_groups = ["test", "ci", "docs", "release", "benchmark"]
extend_exclude = ["guideloom/_benchmark", "scripts"]
